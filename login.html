
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Antrian Rumah Sakit</title>
    <link rel="stylesheet" href="css/login.css">
    <script src="dist/auth.js" defer></script>
    <script src="dist/login.js" defer></script>
</head>
<body>
    <main class="login-container">
        <section class="login-card">
            <div class="logo">+</div>

            <h1>Antrian Rumah Sakit</h1>
            <p class="subtitle">Silakan masuk ke akun Anda</p>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        placeholder="Masukkan username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Masukkan password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <p id="loading" class="loading" hidden>
                    Sedang memverifikasi akun...
                </p>

                <p id="error-message" class="error-message" role="alert"></p>

                <button type="submit" id="login-button">
                    Masuk
                </button>
            </form>

            <p class="footer-text">
                Sistem Informasi Antrian Rumah Sakit
            </p>
        </section>
    </main>
</body>
</html>
